<ion-content>
  <div class="login-wrapper">

    <div style="position:absolute; top:16px; right:16px; z-index:5;">
      <app-theme-toggle></app-theme-toggle>
    </div>

    <!-- Panel de marca (solo escritorio) -->
    <div class="brand-panel">
      <div class="brand-panel-content">
        <div class="logo-icon">
          <ion-icon name="shirt-outline"></ion-icon>
        </div>
        <h1 class="brand-name">TIENDA GM</h1>

        <h2 class="brand-headline">Gestiona tu tienda,<br>todo en un solo lugar.</h2>

        <div class="feature-list">
          <div class="feature-item">
            <ion-icon name="cart-outline"></ion-icon>
            <span>Ventas y compras en tiempo real</span>
          </div>
          <div class="feature-item">
            <ion-icon name="shirt-outline"></ion-icon>
            <span>Inventario y tallas centralizados</span>
          </div>
          <div class="feature-item">
            <ion-icon name="bar-chart-outline"></ion-icon>
            <span>Reportes listos para exportar</span>
          </div>
        </div>
      </div>

      <div class="brand-panel-deco"></div>
    </div>

    <!-- Panel de formulario -->
    <div class="form-panel">
      <div class="login-container">

        <div class="logo-area mobile-only">
          <div class="logo-icon">
            <ion-icon name="shirt-outline"></ion-icon>
          </div>
          <h1 class="brand-name">TIENDA GM</h1>
          <p class="brand-sub">Panel de Administración</p>
        </div>

        <div class="login-card">

          <h2 class="card-title">Bienvenido</h2>
          <p class="card-subtitle">Ingresa tus credenciales para continuar</p>

          <form (ngSubmit)="iniciarSesion()">

            <div class="input-group">
              <div class="input-icon">
                <ion-icon name="mail-outline"></ion-icon>
              </div>
              <ion-input
                class="custom-input"
                type="email"
                placeholder="Correo electrónico"
                [(ngModel)]="correo"
                name="correo"
                autocomplete="email">
              </ion-input>
            </div>

            <div class="input-group">
              <div class="input-icon">
                <ion-icon name="lock-closed-outline"></ion-icon>
              </div>
              <ion-input
                class="custom-input"
                [type]="mostrarPass ? 'text' : 'password'"
                placeholder="Contraseña"
                [(ngModel)]="contrasena"
                name="contrasena"
                autocomplete="current-password">
              </ion-input>
              <div class="toggle-pass" (click)="togglePass()">
                <ion-icon [name]="mostrarPass ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </div>
            </div>

            <!-- Error inline -->
            <div class="inline-error" *ngIf="errorMsg">
              <ion-icon name="alert-circle-outline"></ion-icon>
              <span>{{ errorMsg }}</span>
            </div>

            <button type="submit" class="btn-login" [disabled]="cargando">
              <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
              <span *ngIf="!cargando">Ingresar</span>
              <ion-icon *ngIf="!cargando" name="arrow-forward-outline"></ion-icon>
            </button>
          </form>

          <div class="divider">
            <span>¿Eres cliente?</span>
          </div>

          <button class="btn-outline" routerLink="/login-cliente">
            <ion-icon name="person-outline"></ion-icon>
            <span>Ingresar como Cliente</span>
          </button>

          <button class="btn-ghost" routerLink="/registro-cliente">
            <span>Crear cuenta nueva</span>
          </button>

        </div>
      </div>
    </div>

  </div>
</ion-content>
