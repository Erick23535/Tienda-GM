<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 20px 16px; flex-wrap:wrap;">
  <div>
    <h1 style="font-size:22px; font-weight:800; color:var(--admin-text); margin:0 0 2px;">{{ titulo }}</h1>
    <p *ngIf="subtitulo" style="font-size:13px; color:var(--admin-text-faint); margin:0;">{{ subtitulo }}</p>
  </div>

  <div style="display:flex; align-items:center; gap:10px;">
    <app-theme-toggle></app-theme-toggle>

    <button *ngIf="accionTexto" (click)="accion.emit()"
            style="display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--admin-gold),var(--admin-gold-light)); border:none; border-radius:var(--admin-radius-sm); padding:11px 18px; cursor:pointer; box-shadow:0 4px 16px rgba(212,175,55,0.3);">
      <ion-icon [name]="accionIcono" style="font-size:16px; color:var(--admin-ink);"></ion-icon>
      <span style="font-size:13px; font-weight:700; color:var(--admin-ink);">{{ accionTexto }}</span>
    </button>
  </div>
</div>
