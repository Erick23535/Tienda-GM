<div *ngIf="visible"
     style="position:fixed; bottom:24px; left:16px; right:16px; z-index:1200; display:flex; justify-content:center; pointer-events:none;">

  <div #caja [style.border-color]="colorVar + '4d'"
       style="width:100%; max-width:380px; background:var(--admin-bg-elevated); border:1px solid; border-radius:var(--admin-radius-md); box-shadow:0 16px 40px rgba(0,0,0,0.5); padding:13px 16px; display:flex; align-items:center; gap:12px; animation:app-toast-slide-up 0.3s ease;">

    <ion-icon [name]="icono" [style.color]="colorVar" style="font-size:22px; flex-shrink:0;"></ion-icon>
    <p style="font-size:13px; font-weight:600; color:var(--admin-text); margin:0; line-height:1.4; flex:1;">{{ mensaje }}</p>
  </div>
</div>

<style>
  @keyframes app-toast-slide-up {
    0%   { transform: translateY(30px); opacity: 0; }
    100% { transform: translateY(0);    opacity: 1; }
  }
</style>
