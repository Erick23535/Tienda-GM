<nav class="bn-bar">
  <button *ngFor="let tab of tabs"
          class="bn-tab"
          [class.bn-tab-active]="seccion === tab.valor"
          [attr.aria-label]="tab.etiqueta"
          [attr.aria-current]="seccion === tab.valor ? 'page' : null"
          (click)="cambiar.emit(tab.valor)">
    <span class="bn-icon-wrap">
      <ion-icon [name]="tab.icono" aria-hidden="true"></ion-icon>
      <span *ngIf="badgeDe(tab.valor) > 0" class="bn-badge">{{ badgeDe(tab.valor) > 9 ? '9+' : badgeDe(tab.valor) }}</span>
    </span>
    <span class="bn-label" *ngIf="seccion === tab.valor">{{ tab.etiqueta }}</span>
  </button>
</nav>
